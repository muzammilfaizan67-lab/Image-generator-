<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Prompt Generator Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#050816,#0f172a,#1e293b);
color:white;
padding:20px;
}

.container{
max-width:1400px;
margin:auto;
}

.title{
text-align:center;
font-size:48px;
font-weight:bold;
margin-bottom:25px;
background:linear-gradient(90deg,#00f5ff,#8b5cf6,#ff00aa);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:25px;
box-shadow:0 0 30px rgba(0,255,255,.08);
}

textarea{
width:100%;
height:180px;
padding:20px;
border:none;
outline:none;
border-radius:18px;
background:rgba(255,255,255,.08);
color:white;
font-size:16px;
resize:none;
}

.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:15px;
margin:25px 0;
}

.category{
padding:15px;
text-align:center;
background:rgba(255,255,255,.08);
border-radius:15px;
cursor:pointer;
transition:.3s;
}

.category:hover,
.active{
background:linear-gradient(135deg,#00f5ff,#8b5cf6);
transform:translateY(-4px);
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
}

button{
padding:15px 25px;
border:none;
border-radius:15px;
cursor:pointer;
font-weight:700;
color:white;
transition:.3s;
}

.generate{
background:linear-gradient(135deg,#00f5ff,#8b5cf6);
}

.random{
background:linear-gradient(135deg,#ff0080,#ff7b00);
}

.copy{
background:#16a34a;
margin-top:15px;
}

button:hover{
transform:translateY(-4px);
}

.output{
margin-top:25px;
padding:20px;
border-radius:18px;
background:rgba(255,255,255,.08);
min-height:180px;
line-height:1.8;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:35px;
}

.card{
background:rgba(255,255,255,.05);
padding:25px;
border-radius:20px;
border:1px solid rgba(255,255,255,.1);
}

.card h2{
font-size:36px;
margin-bottom:10px;
}

.history{
margin-top:35px;
}

.history-item{
background:rgba(255,255,255,.08);
padding:15px;
border-radius:15px;
margin-bottom:12px;
transition:.3s;
}

.history-item:hover{
transform:translateX(8px);
}

@media(max-width:768px){
.title{
font-size:34px;
}
}
</style>
</head>
<body>

<div class="container">

<h1 class="title">AI Image Prompt Generator Pro</h1>

<div class="glass">

<textarea id="idea" placeholder="Enter your idea or topic..."></textarea>

<div class="categories">
<div class="category active">Realistic</div>
<div class="category">Cinematic</div>
<div class="category">Anime</div>
<div class="category">Fantasy</div>
<div class="category">3D Render</div>
<div class="category">Digital Art</div>
</div>

<div class="buttons">
<button class="generate" onclick="generatePrompt()">Generate Prompt</button>
<button class="random" onclick="randomPrompt()">Random Prompt</button>
</div>

<div class="output" id="output">
Generated prompt will appear here...
</div>

<button class="copy" onclick="copyPrompt()">Copy Prompt</button>

</div>

<div class="dashboard">

<div class="card">
<h2 id="totalPrompts">0</h2>
<p>Total Prompts</p>
</div>

<div class="card">
<h2>6</h2>
<p>Categories</p>
</div>

<div class="card">
<h2>PRO</h2>
<p>AI Generator Status</p>
</div>

</div>

<div class="history glass">
<h2 style="margin-bottom:20px;">Prompt History</h2>
<div id="historyList"></div>
</div>

</div>

<script>

let selectedCategory="Realistic";

document.querySelectorAll(".category").forEach(item=>{
item.onclick=()=>{
document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

item.classList.add("active");
selectedCategory=item.innerText;
}
});

function generatePrompt(){

let idea=document.getElementById("idea").value;

if(!idea){
alert("Please enter a topic.");
return;
}

let prompt=`
${idea},
Subject: Highly detailed main character,
Lighting: Cinematic volumetric lighting,
Camera Angle: Dynamic low-angle shot,
Environment: Immersive atmospheric scene,
Art Style: ${selectedCategory},
Quality: Ultra detailed, 8K, masterpiece,
Color Palette: Vibrant premium colors,
Sharp focus, professional composition
`;

document.getElementById("output").innerText=prompt;

saveHistory(prompt);
}

function randomPrompt(){

const ideas=[
"Cyberpunk city",
"Dragon king",
"Neon samurai",
"Fantasy castle",
"Future AI robot",
"Space explorer",
"Dark angel",
"Magic forest"
];

document.getElementById("idea").value=
ideas[Math.floor(Math.random()*ideas.length)];
}

function copyPrompt(){
navigator.clipboard.writeText(
document.getElementById("output").innerText
);
alert("Prompt Copied");
}

function saveHistory(prompt){

let history=
JSON.parse(localStorage.getItem("prompts")) || [];

history.unshift(prompt);

localStorage.setItem(
"prompts",
JSON.stringify(history)
);

loadHistory();
}

function loadHistory(){

let history=
JSON.parse(localStorage.getItem("prompts")) || [];

document.getElementById("totalPrompts")
.innerText=history.length;

let html="";

history.forEach(item=>{
html+=`<div class="history-item">${item}</div>`;
});

document.getElementById("historyList").innerHTML=
html || "No prompts generated yet.";
}

loadHistory();

</script>

</body>
  </html>
